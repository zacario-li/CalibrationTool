<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stereo Calibration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-success">
        <span class="navbar-brand">Stereo Camera Calibration</span>
    </nav>

    <div class="container mt-4">
        <div class="card shadow">
            <div class="card-body">
                <h5>Upload Stereo Pairs</h5>
                <form id="stereoForm" enctype="multipart/form-data">
                    <div class="row">
                        <div class="col-6">
                            <label>Left Camera Images</label>
                            <input type="file" id="leftImages" multiple class="form-control">
                        </div>
                        <div class="col-6">
                            <label>Right Camera Images</label>
                            <input type="file" id="rightImages" multiple class="form-control">
                        </div>
                    </div>

                    <div class="mt-3">
                        <div class="row">
                            <div class="col-4">
                                <label>Checkerboard Rows</label>
                                <input id="rows" type="number" value="10" class="form-control">
                            </div>
                            <div class="col-4">
                                <label>Checkerboard Columns</label>
                                <input id="cols" type="number" value="7" class="form-control">
                            </div>
                            <div class="col-4">
                                <label>Cell Size (mm)</label>
                                <input id="cellsize" type="number" step="0.01" value="1.0" class="form-control">
                            </div>
                        </div>
                    </div>

                    <div class="text-center mt-3">
                        <button class="btn btn-success btn-lg">
                            Calibrate Stereo
                        </button>
                    </div>
                </form>

                <div class="mt-4">
                    <h6>Rectification Preview</h6>
                    <div class="row">
                        <div class="col-6">
                            <img id="imageLeft" class="w-100 img-fluid">
                        </div>
                        <div class="col-6">
                            <img id="imageRight" class="w-100 img-fluid">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
